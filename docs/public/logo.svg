<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rustMetal" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="48%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="rustOxide" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="castIron" x1="8" y1="36" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="55%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
  </defs>

  <!-- Notched Circular Saw Blade -->
  <path d="M32 4 L35.5 11.5 L42.5 7 L43 15.2 L51 13.5 L48.3 21.4 L56.4 22.8 L51.1 29.2 L58 33.8 L50.8 37.8 L55.4 44.5 L47.2 45.2 L48.6 53 L40.8 50.4 L39.2 57.5 L33 52.4 L28 57.5 L26.5 50.2 L18.5 52.8 L20 45 L11.8 44.2 L16.2 37.5 L9.2 33.5 L16.2 29 L11 22.5 L19 21.2 L16.2 13.2 L24.2 15 L25 7 L31.5 11.6 Z"
        fill="url(#rustMetal)" stroke="#431407" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Rust Stain Arcs on Blade -->
  <path d="M18 24 A17 17 0 0 1 44 17 A15 15 0 0 0 21 31 Z" fill="url(#rustOxide)" opacity="0.82"/>
  <path d="M46 28 A16 16 0 0 1 25 46 A14 14 0 0 0 43 26 Z" fill="#9a3412" opacity="0.72"/>

  <!-- Inner Gear Ring -->
  <circle cx="33.5" cy="31" r="12.5" fill="#1e293b" stroke="#ea580c" stroke-width="2"/>
  <circle cx="33.5" cy="31" r="7.5" fill="#334155" stroke="#94a3b8" stroke-width="1.4"/>
  <circle cx="33.5" cy="31" r="3" fill="#c2410c"/>

  <!-- Blade Vent Slots -->
  <line x1="33.5" y1="15" x2="33.5" y2="18.2" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="47.5" y1="26" x2="44.8" y2="27.5" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="26" x2="22.8" y2="27.5" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Weathered Cast-Iron Saw Table & Frame Guard -->
  <path d="M6 39 H58 V44 H53 V55 H45 V45 H21 V55 H13 V44 H6 Z" fill="url(#castIron)" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
  <rect x="6" y="38" width="52" height="4" rx="1.5" fill="url(#rustOxide)" stroke="#431407" stroke-width="1.2"/>

  <!-- Rivets & Oxidation Pits -->
  <circle cx="17" cy="49.5" r="1.5" fill="#94a3b8"/>
  <circle cx="49" cy="49.5" r="1.5" fill="#94a3b8"/>
  <circle cx="28" cy="41.5" r="1.2" fill="#fed7aa" opacity="0.75"/>
  <circle cx="39" cy="41.5" r="1.2" fill="#fed7aa" opacity="0.75"/>
  <circle cx="24" cy="21" r="1.4" fill="#ea580c"/>
  <circle cx="43" cy="34" r="1.6" fill="#c2410c"/>
</svg>
